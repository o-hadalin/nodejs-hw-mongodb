type: object
properties:
  id:
    type: string
    description: Unique identifier of the user
    example: '60c72b2f5f1b2c001c8e8e3e'
  name:
    type: string
    description: The user's name
    example: 'John Doe'
  email:
    type: string
    description: The user's email address
    example: 'johndoe@example.com'
