type: object
properties:
  id:
    type: string
    example: '60f8e7e3e7c3a2b6f838b93e'
  userId:
    type: string
    example: '60f8e7e3e7c3a2b6f838b93d'
  accessToken:
    type: string
    example: 'abc123accessToken'
  refreshToken:
    type: string
    example: 'xyz789refreshToken'
  accessTokenValidUntil:
    type: string
    format: date-time
    example: '2025-04-10T12:00:00Z'
  refreshTokenValidUntil:
    type: string
    format: date-time
    example: '2025-05-10T12:00:00Z'
  message:
    type: string
    description: Message associated with the session response
    example: 'Session created successfully!'
required:
  - id
  - userId
  - accessToken
  - refreshToken
  - accessTokenValidUntil
  - refreshTokenValidUntil
