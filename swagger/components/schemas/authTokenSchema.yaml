type: object
properties:
  accessToken:
    type: string
    description: JWT access token for the user
    example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoiNjBjNzJiMmY1ZjFiMmMwMDFjOGU4ZGUzZiIsImlhdCI6MTYyMjMwMjU3NywiZXhwIjoxNjIyMzA2MTM3fQ.PVg3zAYnN2vqkpJGbLJebHETK-3Z0dF3Vop5FOkxg_c'
  refreshToken:
    type: string
    description: Refresh token to generate new access tokens
    example: 'hxh2kjskdkd9d8d9d80sdj12ds89'
  message:
    type: string
    description: Message associated with the token response
    example: 'Successfully logged in a user!'
