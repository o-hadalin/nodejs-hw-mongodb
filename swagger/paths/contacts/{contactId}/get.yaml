get:
  tags:
    - Contacts
  summary: Get contact by ID
  operationId: getContactById
  description: Retrieve a contact's full information by its unique identifier.
  security:
    - bearerAuth: []
  parameters:
    - name: contactId
      in: path
      required: true
      description: ID of the contact to retrieve
      schema:
        type: string
  responses:
    '200':
      description: Contact found successfully
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/Contact.yaml
    '404':
      description: Contact not found
      content:
        application/json:
          schema:
            $ref: '../../../components/responses/NotFound.yaml'
