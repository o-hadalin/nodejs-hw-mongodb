tags:
  - Contacts
operationId: updateContact
summary: Update contact information by ID
description: This endpoint allows you to update specific contact details by its unique ID.
security:
  - bearerAuth: []
parameters:
  - name: id
    in: path
    required: true
    description: ID of the contact to update
    schema:
      type: string
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          id:
            type: string
            example: '60f8e7e3e7c3a2b6f838b93e'
          name:
            type: string
            example: 'John Doe'
          email:
            type: string
            format: email
            example: 'johndoe@example.com'
          phoneNumber:
            type: string
            example: '+1234567890'
        required: []
responses:
  200:
    description: Successfully updated contact details
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/Contact.yaml'
  '400':
    $ref: '../../../components/responses/400.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
