summary: Login a user
operationId: loginUser
tags:
  - Auth
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          email:
            type: string
            example: 'user@example.com'
          password:
            type: string
            example: 'password123'
        required:
          - email
          - password
responses:
  200:
    $ref: ../../components/responses/200.yaml
  400:
    $ref: ../../components/responses/400.yaml
  401:
    $ref: ../../components/responses/401.yaml
