summary: Reset user password
operationId: resetPassword
tags:
  - Auth
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          resetToken:
            type: string
            example: 'RESET-TOKEN-HERE'
          newPassword:
            type: string
            example: 'newpassword123'
        required:
          - resetToken
          - newPassword
responses:
  200:
    $ref: '../../components/responses/200.yaml'
  400:
    $ref: '../../components/responses/400.yaml'
  404:
    $ref: '../../components/responses/404.yaml'
