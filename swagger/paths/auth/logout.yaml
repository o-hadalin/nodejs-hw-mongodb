summary: Logout a user
operationId: logoutUser
tags:
  - Auth
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          refreshToken:
            type: string
            description: Refresh token of the user to log out
            example: 'REFRESH-TOKEN-HERE'
responses:
  200:
    description: Successful session details
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/Session.yaml'
  400:
    $ref: '../../components/responses/400.yaml'
  401:
    $ref: '../../components/responses/401.yaml'
